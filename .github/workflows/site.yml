name: Site

# Builds the website, validates it, checks links, and deploys it to
# Cloudflare Pages.
#
# - Every push and pull request: build, HTML validation, internal link check
#   (scripts/test-site.sh), then lychee for external links.
# - Push to main only: deploy dist/ to the Cloudflare Pages project
#   "whisker-and-wrench", but only after the checks pass. The deploy job is
#   skipped until the CLOUDFLARE_ACCOUNT_ID repo variable and the
#   CLOUDFLARE_API_TOKEN repo secret are set (see docs/OPERATIONS.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Build, validate HTML, check internal links
        run: bash scripts/test-site.sh

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --max-retries 3
            --accept 200,206,429
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            --exclude '^https://whiskerandwrench\.com'
            'dist/**/*.html'
          fail: true

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://whiskerandwrench.com
    steps:
      - name: Download built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.146.0"
          command: pages deploy dist --project-name=whisker-and-wrench --branch=main --commit-dirty=true
